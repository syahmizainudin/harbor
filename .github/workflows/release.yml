name: Release

# Push a tag like v0.2.0 to publish a GitHub release. Before tagging, set
# cbzwebp/__init__.py __version__ to 0.2.0 and add a "## 0.2.0" section to CHANGELOG.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag matches __version__ and CHANGELOG has notes
        run: python ci/release_notes.py "${GITHUB_REF_NAME}" > notes.md
      - uses: actions/upload-artifact@v5
        with:
          name: notes
          path: notes.md

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v6
        with:
          name: notes
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "harbor ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag ${prerelease}
