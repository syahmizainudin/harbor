<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor</title>
<style>
  :root { --bg: #ffffff; --text: #1d2330; --muted: #667085; --line: #e3e6eb; --accent: #2f6fed; --accent-text: #fff;
          --ok: #16794c; --bad: #c0362c; --chip: #eef1f5; --hover: #f1f4f9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1f27; --text: #e6e9ef; --muted: #98a2b3; --line: #2a313c; --accent: #5b8cff; --accent-text: #0b1020;
            --ok: #4cc38a; --bad: #ff6b5e; --chip: #232a35; --hover: #222833; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 380px; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  header img { width: 22px; height: 22px; }
  header strong { font-size: 15px; flex: 1; }
  section { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; }
  button { border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 5px 10px; border-radius: 7px; cursor: pointer; font: inherit; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  button.link { border: none; background: none; color: var(--accent); padding: 0 2px; }
  .status { font-size: 12px; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; color: var(--muted); }
  .chip b { color: var(--text); }
  ul { list-style: none; margin: 0; padding: 0; }
  .active li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; font-size: 12px; }
  .active li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .active li span:last-child { color: var(--muted); white-space: nowrap; }
  .links { max-height: 210px; overflow: auto; border: 1px solid var(--line); border-radius: 7px; }
  .links li label { display: flex; gap: 6px; align-items: flex-start; padding: 5px 8px; cursor: pointer; }
  .links li + li { border-top: 1px solid var(--line); }
  .links li label:hover { background: var(--hover); }
  .links .name { overflow-wrap: anywhere; }
  .links .url { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
  h2 label { text-transform: none; letter-spacing: 0; font-weight: 400; display: flex; gap: 4px; align-items: center; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .grow { flex: 1; }
  .muted { color: var(--muted); font-size: 12px; }
  .msg { min-height: 1.3em; font-size: 12px; margin-top: 6px; }
  .msg.err { color: var(--bad); } .msg.ok { color: var(--ok); }
  input[type=text] { width: 100%; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text); font: 12px ui-monospace, Consolas, monospace; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details label { display: block; margin-top: 8px; font-size: 12px; }
  .empty { color: var(--muted); padding: 8px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <img src="icons/32.png" alt="">
  <strong>Harbor</strong>
  <span class="status" id="status">Connecting…</span>
</header>

<section>
  <div class="chips" id="chips"></div>
  <ul class="active" id="active"></ul>
  <div class="row">
    <button class="primary grow" id="sendTab">Send this tab</button>
    <button id="openHarbor">Open Harbor</button>
  </div>
</section>

<section>
  <h2>Links on this page
    <label class="muted"><input type="checkbox" id="allLinks"> all links</label>
  </h2>
  <ul class="links" id="links"><li class="empty">Looking for links…</li></ul>
  <div class="row">
    <button class="link" id="selectAll">Select all</button>
    <span class="grow"></span>
    <button class="primary" id="sendSelected" disabled>Send selected</button>
  </div>
  <div class="msg" id="msg"></div>
</section>

<section>
  <details id="settingsBox">
    <summary>Settings</summary>
    <label>Harbor address <input type="text" id="harborUrl" placeholder="http://localhost:8765"></label>
    <label>Token <input type="password" id="token" placeholder="hbt_… from Harbor → Account" autocomplete="off"></label>
    <label>Save to folder <input type="text" id="dest" placeholder="Harbor's default"></label>
    <label class="row" style="margin-top:8px"><input type="checkbox" id="convert"> Convert .zip / .cbz downloads to WebP .cbz</label>
    <div class="muted" style="margin-top:6px">The API key, quality and delete settings come from Harbor (its .env and Convert tab defaults).</div>
  </details>
</section>

<script type="module" src="popup.js"></script>
</body>
</html>
